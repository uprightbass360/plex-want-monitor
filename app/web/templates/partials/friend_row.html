<form class="frow friend-row" hx-post="/fragments/settings/friends" hx-trigger="change" hx-target="closest .friend-row" hx-swap="outerHTML">
  <input type="hidden" name="hash" value="{{ a.hash }}">
  <input name="label" type="text" class="in" maxlength="60" value="{{ a.label or '' }}" placeholder="Label for {{ a.hash[:8] }}" aria-label="Label for friend {{ a.hash[:8] }}">
  <span class="muted">{{ a.item_count }} item{{ "" if a.item_count == 1 else "s" }}</span>
  {% if saved %}<span class="ok-text" role="status">Saved</span>{% endif %}
</form>
